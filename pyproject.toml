[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitdesk"
version = "0.2.0"
description = "A local-first desktop voice assistant for Windows"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "edge-tts>=7.3.1",
  "pygame>=2.6.1",
  "sounddevice>=0.5.6",
  "PySide6>=6.7.0",
  "psutil>=5.9.0",
  "pyttsx3>=2.90",
  "faster-whisper>=1.0.0",
  "openwakeword>=0.6.0",
  "onnxruntime>=1.17.0",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "pyperclip>=1.8.2",
  "pycaw>=20240210",
  "screen-brightness-control>=0.23.0",
  "Markdown>=3.6",
  "Pygments>=2.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orbitdesk = "orbitdesk.ui.dashboard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
